name: CI

# Runs on every push and pull request. Nothing here touches a network API:
# the suite fakes both Alpha Vantage and SEC EDGAR, so CI costs none of the
# 25-request daily budget and cannot be broken by a provider outage.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
