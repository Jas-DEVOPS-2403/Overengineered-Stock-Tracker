name: CI

# Runs on every push to main, every pull request, and by hand. Nothing here
# touches a network API: the suite fakes both Alpha Vantage and SEC EDGAR, so
# CI costs none of the 25-request daily budget and cannot be broken by a
# provider outage.
#
# What each job covers:
#   test       ruff, then pytest: the Python, the page's inline JavaScript
#              (node --check, in tests/test_web.py) and the workflows' own
#              structure (tests/test_workflows.py)
#   workflows  actionlint: Actions syntax, expressions and shell in run steps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The page's syntax check shells out to node. The runner image ships
      # one, but pinning it means the check cannot silently skip.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # -rs prints the reason for any skipped test, so a skipped syntax
      # check shows up in the log instead of passing quietly.
      - name: Tests
        run: pytest -rs

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
